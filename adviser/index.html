<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>New client | UK Expat Mortgages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#0e3b53;--gold:#c89b3c;--ink:#10222e;--soft:#44586a;--line:#e4e0d6;--bg:#f6f4ef;--ok:#2f7a4f;--err:#a3261b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.logo{font-family:Fraunces,serif;font-size:20px;font-weight:600;color:var(--brand)}
.logo span{color:var(--gold)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--brand);font-size:26px;margin:18px 0 4px}
.sub{color:var(--soft);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
label{display:block;font-weight:500;font-size:14px;margin-bottom:12px}
input[type=text],input[type=password],textarea{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid #cfc9bb;border-radius:9px;font:inherit;background:#fff}
textarea{height:250px;font-size:14px}
.rem{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--soft)}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:10px;padding:14px;font:600 16px Inter,sans-serif;cursor:pointer;text-decoration:none;color:#fff;background:var(--brand);margin-top:10px}
.btn.gold{background:var(--gold)}.btn.wa{background:#1f8f4e}.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.6}
.msg{font-weight:600;margin:10px 0 0}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.link{word-break:break-all;background:#f1ede4;border-radius:8px;padding:10px;font-size:14px;margin:6px 0 4px}
.hidden{display:none}
small{color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">UK Expat <span>Mortgages</span></div>
  <h1>New client</h1>
  <p class="sub">Creates the client's Dropbox folder and their own fact-find link.</p>

  <div class="card" id="formCard">
    <label>Client first name<input type="text" id="first" autocomplete="off" autocapitalize="words" placeholder="e.g. Ahmed"></label>
    <label>Client surname<input type="text" id="last" autocomplete="off" autocapitalize="words" placeholder="e.g. Khan"></label>
    <label>Your adviser password<input type="password" id="pw" autocomplete="current-password"></label>
    <label class="rem"><input type="checkbox" id="remember"> Remember the password on this device</label>
    <button class="btn gold" id="go">Create client link</button>
    <p class="msg hidden" id="msg"></p>
  </div>

  <div class="card hidden" id="outCard">
    <p class="msg ok" style="margin-top:0" id="okTxt"></p>
    <small>Client link</small>
    <div class="link" id="link"></div>
    <button class="btn ghost" id="copyLink">Copy link</button>
    <a class="btn wa" id="wa" target="_blank" rel="noopener">Send by WhatsApp</a>
    <a class="btn" id="mail">Send by email</a>
    <label style="margin-top:18px">Message (you can edit it before sending)<textarea id="text"></textarea></label>
    <button class="btn ghost" id="copyText" style="margin-top:0">Copy message</button>
    <button class="btn ghost" id="again">Set up another client</button>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var KEY='uem-adviser-pw';
  try{var saved=localStorage.getItem(KEY);if(saved){$('pw').value=saved;$('remember').checked=true;}}catch(e){}
  function say(t,ok){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');}
  function message(first,link){
    return 'Hello '+first+',\n\n'+
      'Thank you for getting in touch. To get started on your UK mortgage, please complete this short fact-find. It takes about 5 minutes, and at the end you can add photos of your documents:\n\n'+
      link+'\n\n'+
      'Your information comes privately and securely to me.\n\n'+
      'Documents that help: passport, visa or residence permit, proof of address, and your last 3 months payslips and bank statements.\n\n'+
      'Kind regards,\nJohn Florey\nSpecialist UK Expat Mortgage Adviser\nUK Expat Mortgages\njohn.florey@opesfp.com\nwww.uk-expat-mortgage.co.uk';
  }
  function refreshSend(){
    var t=$('text').value;
    $('wa').href='https://wa.me/?text='+encodeURIComponent(t);
    $('mail').href='mailto:?subject='+encodeURIComponent('Your UK mortgage fact-find')+'&body='+encodeURIComponent(t);
  }
  function copy(t,btn){
    var done=function(){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1500);};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,function(){});
  }
  $('go').onclick=function(){
    var first=$('first').value.trim(),last=$('last').value.trim(),pw=$('pw').value;
    if(!first||!last){say('Please enter the client first name and surname.');return;}
    if(!pw){say('Please enter your adviser password.');return;}
    var btn=this;btn.disabled=true;btn.textContent='Creating...';$('msg').className='msg hidden';
    fetch('/api/new-client',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({first:first,last:last,password:pw})})
    .then(function(r){return r.json().catch(function(){return {ok:false};});})
    .then(function(j){
      if(!j.ok){
        say(j.error==='wrong_password'?'That password is not right.':
            j.error==='no_password_set'?'The adviser password has not been set up in Cloudflare yet.':
            'Something went wrong creating the folder. Please try again.');
        return;
      }
      try{if($('remember').checked)localStorage.setItem(KEY,pw);else localStorage.removeItem(KEY);}catch(e){}
      $('okTxt').textContent=(j.created?'Folder created: ':'Folder already existed, link ready: ')+j.folder;
      $('link').textContent=j.link;
      $('text').value=message(j.first,j.link);refreshSend();
      $('formCard').classList.add('hidden');$('outCard').classList.remove('hidden');window.scrollTo(0,0);
    })
    .catch(function(){say('Could not connect. Please check your internet and try again.');})
    .then(function(){btn.disabled=false;btn.textContent='Create client link';});
  };
  $('text').oninput=refreshSend;
  $('copyLink').onclick=function(){copy($('link').textContent,this);};
  $('copyText').onclick=function(){copy($('text').value,this);};
  $('again').onclick=function(){$('first').value='';$('last').value='';$('outCard').classList.add('hidden');$('formCard').classList.remove('hidden');};
})();
</script>
</body>
</html>
