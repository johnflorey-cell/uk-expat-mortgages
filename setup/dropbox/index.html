<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connect Dropbox | UK Expat Mortgages</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:#f6f4ef;color:#10222e}
.wrap{max-width:720px;margin:40px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e4e0d6;border-radius:14px;padding:26px}
h1{font-size:24px;color:#0e3b53;margin:0 0 10px}
p,li{line-height:1.55}
.btn{display:inline-block;background:#0e3b53;color:#fff;border:0;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.gold{background:#c89b3c}
textarea{width:100%;box-sizing:border-box;height:90px;font:13px monospace;padding:10px;border:1px solid #cfc9bb;border-radius:8px;margin:10px 0}
.err{color:#a3261b;font-weight:600}
.ok{color:#2f7a4f;font-weight:600}
ol{padding-left:20px}
code{background:#f1ede4;padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="box">
  <h1>Connect the fact-find to Dropbox</h1>
  <p>This is a one-off step for the adviser. It lets the website save each client's fact-find straight into their Dropbox folder.</p>
  <button class="btn" id="go">Connect Dropbox</button>
</div></div>
<script>
(function(){
  var KEY='5ju3aifj0qfxi11';
  var REDIRECT=location.origin+'/setup/dropbox/';
  var box=document.getElementById('box');
  function b64url(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function rnd(){var a=new Uint8Array(48);crypto.getRandomValues(a);return b64url(a);}
  document.getElementById('go').onclick=function(){
    var v=rnd();
    try{sessionStorage.setItem('dbx_v',v);}catch(e){}
    crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(function(h){
      location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({
        client_id:KEY,response_type:'code',token_access_type:'offline',
        code_challenge:b64url(h),code_challenge_method:'S256',redirect_uri:REDIRECT
      });
    });
  };
  var q=new URLSearchParams(location.search),code=q.get('code');
  if(q.get('error')){box.innerHTML='<h1>Not connected</h1><p class="err">Dropbox said: '+(q.get('error_description')||q.get('error')).replace(/[<>]/g,'')+'</p><a class="btn" href="/setup/dropbox/">Try again</a>';return;}
  if(!code)return;
  var v='';try{v=sessionStorage.getItem('dbx_v')||'';}catch(e){}
  box.innerHTML='<h1>Connecting...</h1>';
  fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({
    code:code,grant_type:'authorization_code',client_id:KEY,code_verifier:v,redirect_uri:REDIRECT
  })}).then(function(r){return r.json();}).then(function(j){
    if(!j.refresh_token)throw new Error(j.error_description||j.error||'No token returned');
    history.replaceState(null,'','/setup/dropbox/');
    box.innerHTML='<h1 class="ok">Dropbox connected</h1>'+
      '<p>Last step. Copy this key and save it in Cloudflare. Keep it private: do not email or message it to anyone.</p>'+
      '<textarea id="tok" readonly></textarea>'+
      '<button class="btn gold" id="cp">Copy key</button> <span id="cpd"></span>'+
      '<ol style="margin-top:22px">'+
      '<li>Open <b>dash.cloudflare.com</b>, then <b>Workers &amp; Pages</b>, then your website project.</li>'+
      '<li>Click <b>Settings</b>, then <b>Variables and Secrets</b>, then <b>Add</b>.</li>'+
      '<li>Type: <b>Secret</b>. Variable name: <code>DROPBOX_REFRESH_TOKEN</code>. Value: paste the key. Click <b>Save</b>.</li>'+
      '<li>Tell Claude it is saved. The site needs one quick redeploy to pick it up.</li></ol>';
    document.getElementById('tok').value=j.refresh_token;
    document.getElementById('cp').onclick=function(){var t=document.getElementById('tok');t.select();
      (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(function(){document.execCommand('copy');}).then(function(){document.getElementById('cpd').textContent='Copied';});};
  }).catch(function(e){
    box.innerHTML='<h1>Not connected</h1><p class="err">'+String(e.message).replace(/[<>]/g,'')+'</p><a class="btn" href="/setup/dropbox/">Try again</a>';
  });
})();
</script>
</body>
</html>
